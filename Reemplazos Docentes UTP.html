<style>
/* Layout: barra superior + franja semanal (Lun–Vie) + panel de trabajo por pestañas (Día / Notificaciones / Docentes) */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#e9edf3; --line:#d3dae4;
  --fg:#16212e; --muted:#5a6878; --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#dfe9f6;
  --ok:#1f7a4d; --ok-soft:#dcf1e5; --warn:#a86a00; --warn-soft:#fbefd4; --bad:#b3261e; --bad-soft:#fbe1df;
  --break:#eef1f5;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1621; --surface:#172131; --sunk:#111a27; --line:#2a3850;
  --fg:#e6ecf3; --muted:#9aa9bb; --accent:#7fb0ec; --accent-ink:#0b1420; --accent-soft:#1d3150;
  --ok:#5fcf94; --ok-soft:#173527; --warn:#f0b54a; --warn-soft:#3a2c10; --bad:#ff8a80; --bad-soft:#3d1a18;
  --break:#141e2c; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1621; --surface:#172131; --sunk:#111a27; --line:#2a3850;
  --fg:#e6ecf3; --muted:#9aa9bb; --accent:#7fb0ec; --accent-ink:#0b1420; --accent-soft:#1d3150;
  --ok:#5fcf94; --ok-soft:#173527; --warn:#f0b54a; --warn-soft:#3a2c10; --bad:#ff8a80; --bad-soft:#3d1a18;
  --break:#141e2c; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.6rem} h2{font-size:1.2rem} h3{font-size:1.02rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;justify-content:space-between}
.top .ttl{display:grid;gap:2px}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:6px 10px;border-radius:999px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="ok"] .dot{background:var(--ok)} .sync[data-s="saving"] .dot{background:var(--warn)} .sync[data-s="local"] .dot,.sync[data-s="ro"] .dot{background:var(--bad)}

.weekbar{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.weekhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.weeknav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;line-height:1.2}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);font-weight:700}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:.85rem}
input[type=date]{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.day{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:10px;text-align:left;display:grid;gap:4px;min-width:0}
.day:hover{border-color:var(--accent)}
.day[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.day .dn{font-weight:700;font-family:var(--f-display)}
.day .dd{font-size:.8rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap;width:max-content;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--accent-soft);color:var(--accent)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;font-weight:700;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .count{font-family:var(--f-mono);font-size:.78rem;margin-left:6px;background:var(--sunk);padding:1px 6px;border-radius:999px}

.panel{display:grid;gap:16px}
.dayhead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.addrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:12px}
.addrow select{min-width:0;flex:1 1 220px}
select,.inp{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;max-width:100%}
.inp{width:100%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;min-width:0}
.card-h{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.card-h .who{display:grid;gap:3px;min-width:0}
.card-h .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:.88rem}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.blocks{min-width:960px}
.blocks td:nth-child(2) select{min-width:120px}
.blocks td:nth-child(3) select{min-width:180px}
.blocks td.rep select{min-width:210px}
.blocks th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);font-weight:700}
.blocks td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.blocks tr:last-child td{border-bottom:0}
.blocks td.h{width:54px;font-family:var(--f-mono);text-align:center;color:var(--muted)}
.blocks tr.has td.h{color:var(--accent);font-weight:700}
.blocks tr.brk td{background:var(--break);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:3px 8px;text-align:center}
.blocks select,.blocks .inp{width:100%}
.blocks td.n{width:84px}
.blocks tr.conf td{background:var(--bad-soft)}
.blocks tr.miss td.rep select{border-color:var(--warn)}
.flag{font-size:.75rem;color:var(--bad);font-weight:700;display:block;margin-top:2px}
.flag.w{color:var(--warn)}
.blocks td.h .t{display:block;font-size:.66rem;font-weight:500;color:var(--muted);white-space:nowrap}
.blocks tr.pre td.h{box-shadow:inset 3px 0 0 var(--accent)}
.blocks td.act{min-width:240px}
.blocks textarea.inp{resize:vertical;min-height:34px;line-height:1.35;font-size:.92rem}
.adj{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:5px;font-size:.8rem}
.file{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);border-radius:999px;padding:2px 4px 2px 10px;max-width:100%}
.file a{color:var(--accent);font-weight:700;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .x{border:0;background:none;color:var(--muted);font-size:1rem;line-height:1;padding:0 4px;border-radius:50%}
.file .x:hover{color:var(--bad)}
.attach{cursor:pointer}
.hinfo{padding:8px 14px;font-size:.86rem;background:var(--accent-soft);color:var(--fg);border-bottom:1px solid var(--line)}
.nadj{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px;font-size:.82rem;align-items:center}
.card-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:var(--sunk);border-radius:0 0 var(--r) var(--r);font-size:.88rem}

.confirmbar{position:sticky;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);z-index:3}
.confirmbar-in{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px;box-shadow:0 6px 24px -12px rgba(0,0,0,.35)}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem}
.stats b{font-family:var(--f-mono)}
.ask{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;display:grid;gap:8px;justify-items:start}
.empty p{margin:0;max-width:62ch}

.notifs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-rows:auto 1fr auto;min-width:0}
.ncard.sent{border-color:var(--ok)}
.ncard .card-h{border-bottom:1px solid var(--line)}
.msg{margin:0;padding:12px 14px;white-space:pre-wrap;font-family:var(--f-body);font-size:.9rem;line-height:1.5;overflow-wrap:anywhere}
.contact{font-size:.82rem;color:var(--muted);user-select:all;overflow-wrap:anywhere}
.nact{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
a.btn{text-decoration:none;color:inherit;display:inline-block}

.doclist{min-width:860px}
.doclist th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.doclist td{padding:6px 8px;border-bottom:1px solid var(--line)}
.doclist td.num{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.doclist tr.off td{opacity:.55}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;width:70px;display:inline-block;vertical-align:middle;margin-left:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.over i{background:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:2px;align-content:start}
.kpi b{font-size:1.9rem;line-height:1.1;font-weight:500}
.kpi .muted{font-size:.84rem}
.mot{display:grid;gap:10px;padding:14px}
.mrow{display:grid;grid-template-columns:minmax(120px,190px) 1fr 36px minmax(0,130px);gap:10px;align-items:center}
.mbar{height:14px;background:var(--sunk);border-radius:3px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--accent);border-radius:0 3px 3px 0}
.mval{text-align:right;font-weight:700}
.mdet{font-size:.84rem}
.mtab{min-width:640px}
.mtab th.num{text-align:right}
.mtab td.zero{color:var(--line)}
.mtab tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0;background:var(--sunk)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
@media (max-width:640px){.mrow{grid-template-columns:1fr 36px}.mrow .mbar{grid-column:1/-1;grid-row:2}.mrow .mdet{grid-column:1/-1}}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:700;z-index:10;max-width:calc(100% - 32px)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-size:.9rem}
.app{display:grid;gap:18px}
.topr{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sess{display:inline-flex;align-items:center;gap:4px;font-size:.88rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 12px}
.login{display:grid;justify-items:center;padding-block:24px}
.login form,.login .lbox{width:min(100%,400px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:12px}
.login label,.ufield{display:grid;gap:4px;font-size:.88rem;font-weight:700}
.login .err{color:var(--bad);font-size:.88rem;margin:0}
.login p{margin:0}
.who-line{display:block;font-size:.72rem;color:var(--muted);margin-top:2px;line-height:1.3}
.blocks tr.pend td{background:var(--warn-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:4px}
.seg button{border:0;background:var(--surface);padding:3px 8px;font-size:.78rem;font-weight:700;color:var(--muted)}

.hist summary{cursor:pointer;padding:12px 14px;font-weight:700;font-family:var(--f-display)}

.hist li{display:grid;grid-template-columns:auto 1fr;gap:10px;border-top:1px solid var(--line);padding-top:6px}
.hist time{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
.uform{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:14px}
.uform .ufield{flex:1 1 160px}
.hcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:14px}
.hcard.ok{border-color:var(--ok)}
.hform{display:flex;flex-wrap:wrap;gap:10px;padding:12px 14px 0}
.hform .ufield{flex:1 1 200px;min-width:0}
.hform select{width:100%}
.hres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:12px 14px}
.hres>div{display:grid;gap:2px;align-content:start;background:var(--sunk);border-radius:6px;padding:8px 10px;min-width:0}
.hres b{font-size:1.4rem;font-weight:500}
.hres .muted{font-size:.78rem}
.hgrid{border-collapse:separate;border-spacing:2px;margin:0 12px;width:calc(100% - 24px);font-size:.68rem;min-width:420px}
.hgrid th{color:var(--muted);font-weight:700;padding:2px 4px;text-align:center}
.hgrid td{height:20px;text-align:center;border-radius:3px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px}
.hgrid td.gl{background:var(--accent-soft);color:var(--accent);font-weight:700}
.hgrid td.gn{background:var(--warn-soft);color:var(--warn);font-weight:700}

.hgrid td.gx{background:transparent}
.hdet{padding:8px 14px}
.hdet summary{cursor:pointer;font-weight:700;font-size:.88rem}
.hdet ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px;font-size:.85rem}
.hdet li{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:4px}
@media (max-width:640px){.hres{grid-template-columns:1fr}}

@media (max-width:640px){
  .days{grid-template-columns:repeat(5,minmax(58px,1fr));overflow-x:auto}
  .day .dd{display:none}
  h1{font-size:1.3rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function sumarExtras(){

  for (const [id, x] of Object.entries(S.cfg.extra || {})) if (!BY_ID[id]) {

function asignaturaDe(subj){ const n=norm(subj); return ASIG_ALIAS[n] || ASIG_N[n] || subj.toUpperCase(); }
// Celdas del horario de un docente para un día (1=lunes), expandidas por bloque
// Horario vigente: el confirmado desde la pestaña Horarios; si no hay, el de septiembre incluido en la página
const horarioDe = id => S.hor.docentes?.[id] || HORARIOS[id] || null;
const fuenteDe = id => S.hor.docentes?.[id] ? (S.hor.docentes[id].fuente || "horario cargado") : HORARIO_FUENTE;
function horarioDia(id, wd){
  const h = horarioDe(id); if (!h) return null;
  const out = [];
  for (const [d, rows, subj, curso, tipo] of h.c) if (d===wd) for (const b of rows.split(",")) if (b!=="AS") out.push({h:b, subj, curso, tipo});
  return out.sort((a,b)=>hOrd(a.h)-hOrd(b.h));
}
// Estado de un posible reemplazante en un bloque, según su horario
function estadoEn(id, wd, h){
  const dia = horarioDia(id, wd); if (!dia) return {k:"sin"};
  const c = dia.find(x=>x.h===String(h)); if (!c) return {k:"libre"};
  return c.tipo==="N" ? {k:"nolect", txt:c.subj} : {k:"clase", txt:c.curso && c.curso!=="TALLER" ? c.curso : c.subj};
}
function rangos(list){ // ["1","2","3"] -> "1–3"
  const idx=list.map(hOrd).sort((a,b)=>a-b); const out=[]; let s=idx[0], p=idx[0];
  for (const i of idx.slice(1).concat([null])) { if (i===p+1) { p=i; continue; } out.push(s===p?ORDEN_H[s]:ORDEN_H[s]+"–"+ORDEN_H[p]); s=p=i; }
  return out.join(", ").replace(/AL/g,"alm.");
}

function queueWrite(key, path, getData, onDenied){
  if (S.mode === "ro") return;
  if (S.mode !== "db") { localSave(); return; }
  clearTimeout(saveTimers[key]);
  setSync("saving","Guardando…");
  saveTimers[key] = setTimeout(() => {
    saveChains[key] = (saveChains[key] || Promise.resolve()).then(async () => {
      try { await DB.doc(path).set(getData()); setSync("ok","Guardado · compartido con el equipo"); }
      catch(e){
        if (e && e.code === "invalid_argument" && onDenied) { setSync("ok","Conectado · compartido con el equipo"); onDenied(); }
        else if (e && e.code === "invalid_argument") { S.mode="ro"; setSync("ro","Solo lectura"); showBanner("Tu acceso a esta página es de solo lectura: puedes revisar los reemplazos, pero no modificarlos."); render(); }
        else if (e && e.code === "quota_exceeded") { setSync("ro","Sin espacio"); toast("No se pudo guardar: la base de datos está llena."); }
        else { setSync("saving","Reintentando…"); await new Promise(r=>setTimeout(r,800+Math.random()*800)); try{ await DB.doc(path).set(getData()); setSync("ok","Guardado · compartido con el equipo"); }catch(_){ setSync("ro","Error al guardar"); toast("No se pudo guardar. Revisa tu conexión y vuelve a intentar."); } }
      }
    });
  }, 450);
}
function saveDay(f){ const d=S.days[f]; if(!d) return; d.actualizado=new Date().toISOString(); queueWrite("d:"+f, "dias/"+f, ()=>S.days[f]); }
function saveCfg(){ queueWrite("cfg", "config/docentes", ()=>S.cfg); }
function saveHor(){ queueWrite("hor", "config/horarios", ()=>S.hor); }
function saveUsers(){ queueWrite("seg", "seg/usuarios", ()=>({lista:S.users}), () => { toast("No se guardó: solo quienes pueden editar la página (Editor o Propietario en Compartir) pueden administrar usuarios."); }); }

const b64 = u8 => btoa(String.fromCharCode(...u8));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function hashPass(pw, saltB64){
  const salt = saltB64 ? unb64(saltB64) : crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name:"PBKDF2", salt, iterations:150000, hash:"SHA-256"}, key, 256);
  return {salt: b64(salt), hash: b64(new Uint8Array(bits))};
}
const normUser = s => String(s||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9._-]/g,"");
function quien(){ const o = {u:S.me?.usuario||"?", n:S.me?.nombre||"?", en:new Date().toISOString()}; if (S.cid) o.cid = S.cid; return o; }
// meta: {aus: docente ausente, rep: [reemplazantes involucrados]} para filtrar el historial
function hist(d, txt, meta){ const m = {}; if (meta?.aus) m.aus = meta.aus; const rep = [].concat(meta?.rep||[]).filter(Boolean); if (rep.length) m.rep = [...new Set(rep)]; d.historial = (d.historial||[]).concat([{...quien(), txt, ...m}]).slice(-400); }
const fmtWhen = s => { const d=new Date(s); return `${pad(d.getDate())}/${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function restoreSession(){
  if (S.me) { const u=S.users[S.me.usuario]; if (!u || u.inactivo || u.hash!==S.me.h) logout(true); else S.me={...S.me, nombre:u.nombre, rol:u.rol}; return; }
  try { const s=JSON.parse(sessionStorage.getItem("utp-sesion")||"null"); const u=s&&S.users[s.u]; if (u && !u.inactivo && u.hash===s.h) S.me={usuario:s.u, nombre:u.nombre, rol:u.rol, h:u.hash}; } catch(e){}
}
function logout(silent){ S.me=null; try{sessionStorage.removeItem("utp-sesion");}catch(e){} if(!silent) toast("Sesión cerrada"); renderAuth(); }

$("#login").addEventListener("submit", async e => {
  e.preventDefault(); S.loginErr = "";
  try {
    if (e.target.id==="fLogin") {
      const u = normUser($("#lU").value), rec = S.users[u];
      const ok = rec && !rec.inactivo && (await hashPass($("#lP").value, rec.salt)).hash === rec.hash;
      if (!ok) { S.loginErr = "Usuario o contraseña incorrectos."; renderAuth(); return; }
      S.me = {usuario:u, nombre:rec.nombre, rol:rec.rol, h:rec.hash};
    } else {
      const u = normUser($("#bU").value), nom = $("#bN").value.trim(), p = $("#bP").value;
      if (!u || !nom) { S.loginErr = "Completa usuario y nombre."; renderAuth(); return; }
      if (p.length < 8 || p !== $("#bP2").value) { S.loginErr = "Las contraseñas deben coincidir y tener al menos 8 caracteres."; renderAuth(); return; }
      const hp = await hashPass(p);
      const rol = ROLES_GESTION.has($("#bR").value) ? $("#bR").value : "admin";
      S.users[u] = {nombre:nom, rol, ...hp, creado:new Date().toISOString(), creadoPor:u};
      S.me = {usuario:u, nombre:nom, rol, h:hp.hash};
      saveUsers();
    }
    try { sessionStorage.setItem("utp-sesion", JSON.stringify({u:S.me.usuario, h:S.me.h})); } catch(_){}
    renderAuth(); toast(`Bienvenido/a, ${S.me.nombre}`);
  } catch(err) { S.loginErr = "Este navegador no permite verificar la contraseña aquí. Abre la página publicada."; renderAuth(); }
});

function editing(){ const a=document.activeElement; return a && a.matches && a.matches("input[type=text],input[type=email],input[type=tel],input[type=number],textarea"); }
let pendingRender = false;
function softRender(){ if (editing()) { pendingRender = true; return; } render(); }

async function boot(){
  renderAuth();
  const c = window.claude;
  DB = c && c.use ? await c.use("db").catch(()=>null) : null;
  if (!DB) {
    S.mode = "local"; localLoad(); S.usersLoaded = true; restoreSession();
    setSync("local","Modo local");
    showBanner("Sin conexión a la base compartida: los cambios se guardan solo en este navegador.");
    renderAuth(); return;
  }
  S.mode = "db"; setSync("ok","Conectado · compartido con el equipo");
  c.use("assets").then(a => { S.assets = a; if (a) softRender(); }).catch(()=>{});
  try {
    const user = await c.use("user");
    if (user) {
      S.platEdit = await user.canEdit().catch(()=>false);
      S.cid = await user.id().catch(()=>null);
      const w = await user.can("data.write");
      if (w === false) { S.mode="ro"; setSync("ro","Solo lectura"); showBanner("Tu acceso a esta página es de solo lectura: puedes revisar los reemplazos, pero no modificarlos."); }
    }
  } catch(e){}
  DB.doc("seg/usuarios").onSnapshot(s => {
    if (!saveTimers["seg"] || !s.metadata.hasPendingWrites) S.users = s.exists ? structuredClone(s.data().lista || {}) : {};
    S.usersLoaded = true; restoreSession(); renderAuth();
  }, () => { S.usersLoaded = true; renderAuth(); });
  DB.collection("dias").onSnapshot(snap => {
    for (const ch of snap.docChanges()) {
      if (ch.type === "removed") delete S.days[ch.doc.id];
      else if (!saveTimers["d:"+ch.doc.id] || !ch.doc.metadata.hasPendingWrites) S.days[ch.doc.id] = structuredClone(ch.doc.data());
    }
    softRender();
  }, e => { setSync("ro","Desconectado"); });
  DB.doc("config/docentes").onSnapshot(s => { if (s.exists && (!saveTimers["cfg"] || !s.metadata.hasPendingWrites)) S.cfg = structuredClone(s.data()); if (!S.cfg.docentes) S.cfg.docentes = {}; sumarExtras(); softRender(); }, ()=>{});
  DB.doc("config/horarios").onSnapshot(s => { if (!saveTimers["hor"] || !s.metadata.hasPendingWrites) S.hor = s.exists ? structuredClone(s.data()) : {docentes:{}}; if (!S.hor.docentes) S.hor.docentes = {}; softRender(); }, ()=>{});
}

/* ---------- Cálculos ---------- */
function weekDates(f){ const m=monday(parseISO(f)); return [0,1,2,3,4].map(i=>{ const d=new Date(m); d.setDate(m.getDate()+i); return iso(d); }); }
// Bloques que requieren reemplazo: con curso, no marcados "En el liceo" y ya confirmados
function blocksOf(day){ const out=[]; for (const a of day.ausencias) for (const h in a.bloques) { const b=a.bloques[h]; if (b && b.curso && b.curso!==LICEO && !b.pend) out.push({a, h:String(h), b}); } return out.sort((x,y)=>hOrd(x.h)-hOrd(y.h)); }
const pendientes = a => Object.values(a.bloques).filter(b=>b && b.pend).length;
const esAM = h => hOrd(h) < hOrd("5");
const esParcial = m => PARCIAL.has(m) || /administrativo (AM|PM)$/.test(m||"");
// ¿El docente de esta ausencia falta en el bloque h?
function ausenteEnBloque(a, h){
  h = String(h);
  if (!esParcial(a.motivo)) return true;                     // día completo
  const b = a.bloques[h];
  if (b && b.curso === LICEO) return false;                  // marcado "En el liceo": disponible
  if (b && b.curso) return true;                             // bloque con clase: ausente o por confirmar
  if (a.motivo.endsWith(" AM")) return esAM(h);              // bloque sin clase: según la franja del permiso
  if (a.motivo.endsWith(" PM")) return !esAM(h);
  // Capacitación, actividad institucional, salida: ausente entre el primer y el último bloque marcado como ausente
  const aus = Object.entries(a.bloques).filter(([,x]) => x && x.curso && x.curso !== LICEO).map(([k]) => hOrd(k));
  return aus.length > 0 && hOrd(h) >= Math.min(...aus) && hOrd(h) <= Math.max(...aus);
}
// Aplica la regla del motivo a los bloques: parcial = cada bloque por confirmar; AM/PM = propuesta por confirmar
function aplicarMotivo(a){
  const m = a.motivo; const am = m==="Permiso administrativo AM", pm = m==="Permiso administrativo PM";
  for (const h in a.bloques) {
    const b = a.bloques[h]; if (!b) continue;
    if (b.curso===LICEO && b.cursoOrig) { b.curso=b.cursoOrig; b.asignatura=b.asigOrig||""; }
    delete b.cursoOrig; delete b.asigOrig; delete b.pend;
    if (!b.curso) continue;
    if (PARCIAL.has(m)) b.pend = "?";
    else if (am || pm) { b.pend = "p"; if (am ? !esAM(h) : esAM(h)) enLiceo(b); }
  }
}
function enLiceo(b){ if (b.curso!==LICEO) { b.cursoOrig=b.curso; b.asigOrig=b.asignatura||""; } b.curso=LICEO; b.asignatura=""; delete b.reemplazante; }
function ausenteEn(b){ if (b.curso===LICEO && b.cursoOrig) { b.curso=b.cursoOrig; b.asignatura=b.asigOrig||""; } delete b.cursoOrig; delete b.asigOrig; }
function weekAssigned(f){
  const cnt={}; for (const d of weekDates(f)) { const day=S.days[d]; if(!day) continue; for (const {b} of blocksOf(day)) if (b.reemplazante) cnt[b.reemplazante]=(cnt[b.reemplazante]||0)+1; } return cnt;
}
function dayAnalysis(day){
  // Ausente en un bloque concreto: los motivos parciales y AM/PM dejan disponible al docente donde está "En el liceo"
  const absentAt = (id, h) => day.ausencias.some(a => a.docente===id && ausenteEnBloque(a, h));
  const parcialHoy = id => day.ausencias.some(a => a.docente===id && esParcial(a.motivo));
  const byHour = {}; const issues = {}; const warns = {}; const wd = weekday(day.fecha);
  for (const {a,h,b} of blocksOf(day)) {
    if (!b.reemplazante) continue;
    const k = h+"|"+b.reemplazante; (byHour[k] = byHour[k] || []).push(a.id);
  }
  for (const {a,h,b} of blocksOf(day)) {
    const key = a.id+"|"+h; const r=b.reemplazante;
    if (!r) continue;
    if (r===a.docente) issues[key] = "No puede reemplazarse a sí mismo";
    else if (absentAt(r, h)) issues[key] = "Está ausente en este bloque";
    else if (!activo(r)) issues[key] = "Marcado como no disponible en Docentes y horas: elige otro reemplazante";
    else if (byHour[h+"|"+r].length > 1) issues[key] = "Asignado a dos cursos en el mismo bloque";
    else { const e = estadoEn(r, wd, h); if (e.k==="clase") warns[key] = `Según su horario tiene clase en este bloque (${e.txt})`; }
  }
  const bl = blocksOf(day);
  return { total: bl.length, cubiertos: bl.filter(x=>x.b.reemplazante).length, issues, warns, absentAt, parcialHoy, pend: day.ausencias.reduce((s,a)=>s+pendientes(a),0) };
}
function dayStatus(f){
  const d=S.days[f]; if (!d || !d.ausencias.length) return {cls:"", txt:"Sin ausencias"};
  const an=dayAnalysis(d);
  if (d.estado==="confirmado") {
    const reps = Object.keys(buildNotifs(d)); const sent = reps.filter(r=>notifState(d,r)==="enviado").length;
    if (reps.length && sent===reps.length) return {cls:"ok", txt:"Notificado"};
    return {cls:"info", txt:`Confirmado · ${sent}/${reps.length} avisos`};
  }
  if (Object.keys(an.issues).length) return {cls:"bad", txt:"Con conflictos"};
  if (an.pend) return {cls:"warn", txt:`${an.pend} por confirmar`};
  return {cls:"warn", txt:`Borrador · ${an.cubiertos}/${an.total}`};
}

/* ---------- Notificaciones ---------- */
function buildNotifs(day){
  const per = {};
  for (const {a,h,b} of blocksOf(day)) if (b.reemplazante) (per[b.reemplazante] = per[b.reemplazante] || []).push({h, curso:b.curso, asig:b.asignatura, ausente:a.docente, act:b.actividad, adj:b.adjuntos||[]});
  return per;
}
const adjuntosDe = items => items.flatMap(i=>i.adj);
function message(day, repId, items){
  const r = BY_ID[repId]; const fecha = fmtLong(day.fecha);
  const lines = items.map(i => `• ${hLabel(i.h)}${TIEMPOS[i.h]?` (${TIEMPOS[i.h]})`:""} · ${i.curso}${i.asig?` · ${cap(i.asig.toLowerCase())}`:""} — reemplaza a ${BY_ID[i.ausente]?.pila || i.ausente}${i.act?`\n   Actividad: ${i.act}`:""}${i.adj.length?`\n   Material adjunto: ${i.adj.map(x=>x.name).join(", ")}`:""}`);
  return `Estimado/a ${r ? r.pila : repId}:\n\nLe informamos que se le ha asignado reemplazo el ${fecha}:\n\n${lines.join("\n")}\n\nTotal: ${items.length} ${items.length===1?"hora pedagógica":"horas pedagógicas"}. Ante cualquier duda, acercarse a UTP.\n\nSaludos cordiales,\nUnidad Técnico Pedagógica`;
}
function notifState(day, repId){
  const n = day.notif?.[repId]; if (!n || n.estado!=="enviado") return "pendiente";
  const items = buildNotifs(day)[repId]; if (!items) return "pendiente";
  if (!n.sig) return "enviado"; // avisos marcados antes de existir la firma
  return n.sig === firma(items) ? "enviado" : "cambiado";
}
// Firma del contenido asignado: cambia solo si cambia la asignación, no el formato del texto
const firma = items => JSON.stringify(items.map(i=>[i.h, i.curso, i.asig||"", i.ausente, i.act||"", i.adj.map(x=>x.id)]));

/* ---------- Render ---------- */
function render(){
  if (!S.me) return;
  renderWeek();
  for (const b of document.querySelectorAll(".tab")) b.setAttribute("aria-selected", String(b.dataset.tab===S.tab));
  const d = S.days[S.date]; const reps = d && d.estado==="confirmado" ? Object.keys(buildNotifs(d)) : [];
  $("#nCount").textContent = reps.filter(r=>notifState(d,r)!=="enviado").length;
  const v = $("#view");
  if (S.mode === "loading") { v.innerHTML = `<div class="empty"><p class="muted">Cargando reemplazos…</p></div>`; return; }
  if (S.tab==="dia") v.innerHTML = viewDay();
  else if (S.tab==="notificaciones") v.innerHTML = viewNotifs();
  else if (S.tab==="docentes") v.innerHTML = viewDocentes();
  else if (S.tab==="usuarios" && isAdmin()) v.innerHTML = viewUsuarios();
  else if (S.tab==="historial" && isAdmin()) v.innerHTML = viewHistorial();
  else if (S.tab==="horarios" && isAdmin()) v.innerHTML = viewHorarios();
  else v.innerHTML = viewMensual();
}
function renderWeek(){
  const dates = weekDates(S.date);
  const a=parseISO(dates[0]), b=parseISO(dates[4]);
  $("#weekTitle").textContent = `${a.getDate()} ${a.getMonth()!==b.getMonth()?fmtShort(a).split(" ").slice(1).join(" ")+" ":""}al ${fmtShort(b)} de ${b.getFullYear()}`;
  $("#datePick").value = S.date;
  $("#days").innerHTML = dates.map((f,i)=>{
    const st=dayStatus(f); const d=S.days[f]; const n=d?d.ausencias.length:0;
    return `<button class="day" data-date="${f}" aria-pressed="${f===S.date}">
      <span class="dn">${DIAS[i+1]}</span><span class="dd">${fmtShort(parseISO(f))} · ${n} ${n===1?"ausente":"ausentes"}</span>
      <span class="pill ${st.cls}">${esc(st.txt)}</span></button>`;
  }).join("");
}

function optList(list, sel, empty="—"){ if (sel && !list.includes(sel)) list = [sel, ...list]; return `<option value="">${empty}</option>` + list.map(x=>`<option${x===sel?" selected":""}>${esc(x)}</option>`).join(""); }

function viewDay(){
  const f=S.date, day=getDay(f), wd=weekday(f);
  if (wd===0||wd===6) return `<div class="empty"><h2>Fin de semana</h2><p>Elige un día hábil en la franja superior.</p></div>`;
  const ro = !canAssign(); const locked = day.estado==="confirmado";
  const an = dayAnalysis(day); const wk = weekAssigned(f);
  const absentIds = new Set(day.ausencias.map(a=>a.docente));
  const avail = ROSTER.filter(r=>!absentIds.has(r.id) && activo(r.id));
  const head = `<div class="dayhead"><div><div class="eyebrow">${DIAS[wd]}</div><h2>${esc(cap(fmtLong(f)))}</h2></div>
    ${locked ? `<div class="ask"><span class="pill info">Asignación confirmada</span>${ro?"":`<button class="btn sm" data-act="reopen">Reabrir para editar</button>`}</div>` : ""}</div>`;
  const add = (ro||locked) ? "" : `<div class="addrow"><label for="newAbs" class="eyebrow" style="flex-basis:100%">Registrar docente ausente</label>
    <select id="newAbs">${`<option value="">Selecciona docente…</option>`+avail.map(r=>`<option value="${r.id}">${esc(r.corto)} — ${esc(title(r.nombre))}</option>`).join("")}</select>
    <select id="newMot" aria-label="Motivo">${MOTIVOS.map(m=>`<option>${m}</option>`).join("")}</select>
    <button class="btn primary" data-act="addAbs">Registrar ausencia</button></div>`;
  if (!day.ausencias.length) return head + add + `<div class="empty"><h3>No hay ausencias registradas para este día</h3><p>Registra a cada docente ausente. Luego completa, por bloque, el curso y la asignatura que tenía y elige a quien lo reemplazará. Al confirmar, se generan los avisos para cada reemplazante.</p></div>`;

  const cards = day.ausencias.map(a => cardAusencia(a, day, an, wk, locked||ro)).join("");
  const nIss = Object.keys(an.issues).length; const sin = an.total - an.cubiertos;
  const reps = Object.keys(buildNotifs(day)).length;
  let bar = "";
  if (!locked && !ro) {
    bar = `<div class="confirmbar"><div class="confirmbar-in">
      <div class="stats"><span><b>${an.total}</b> bloques a cubrir</span><span><b>${an.cubiertos}</b> asignados</span>
      ${sin?`<span class="pill warn">${sin} sin reemplazante</span>`:""}${nIss?`<span class="pill bad">${nIss} ${nIss===1?"conflicto":"conflictos"}</span>`:""}${an.pend?`<span class="pill warn">${an.pend} ${an.pend===1?"bloque":"bloques"} por confirmar presencia</span>`:""}</div>

  }

}

/* ---------- Carga de horarios (PDF de aSc Horarios) ---------- */
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
function cargarScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("script")); document.head.append(s); }); }
// El lector corre en la propia página (sin Worker externo): pdf.worker define pdfjsWorker y pdf.js lo usa directamente
async function pdfjsListo(){ if (!window.pdfjsLib) await cargarScript(PDFJS+"pdf.min.js"); if (!window.pdfjsWorker) await cargarScript(PDFJS+"pdf.worker.min.js"); return window.pdfjsLib; }
// Geometría de la plantilla aSc (página carta horizontal): bandas de filas y columnas de días
const ROWB = [162,205,247,290,332,374,417,459,502,544,587,629,671,714,756,799];
const ROWN = ["AS","1","2","R1","3","4","R2","5","6","AL","7","8","9","10","11"];
const ORD_PDF = {PRIMERO:1,SEGUNDO:2,TERCERO:3,CUARTO:4,QUINTO:5,SEXTO:6,"SÉPTIMO":7,OCTAVO:8}, ROM = {1:"I",2:"II",3:"III",4:"IV"};
function cursoUno(s){ s=s.trim(); if (s==="PRE KÍNDER") return "PK"; if (s==="KÍNDER") return "K";
  let m=s.match(/^(\S+) BÁSICO$/); if (m && ORD_PDF[m[1]]) return ORD_PDF[m[1]]+" BÁSICO";
  m=s.match(/^(\S+) MEDIO ([A-D])/); if (m && ORD_PDF[m[1]]) { const n=ORD_PDF[m[1]], r=ROM[n]; if (n<=2) return r+" MEDIO "+m[2]; return {A:r+" MEDIO A",B:r+" ENF",C:r+" REDES C",D:r+" REDES D"}[m[2]]; }
  return null; }
function cursoPdf(raw){
  const parts = raw.replace(/\)(?=[A-ZÁÉÍÓÚ])/g,")/").replace(/([A-D])(?=(PRIMERO|SEGUNDO|TERCERO|CUARTO) )/g,"$1/").split("/").map(cursoUno);
  if (!parts.length || parts.some(p=>!p)) return null;
  const u=[...new Set(parts)]; if (u.length===1) return u[0];
  if (u.length===2 && u.includes("III MEDIO A") && u.includes("IV MEDIO A")) return "IIIA - IVA";
  const lv=[...new Set(u.map(x=>x.split(" ")[0]))]; return lv.length===1 ? lv[0]+" MEDIOS" : u.join(" + ");
}
const NO_LECT = /consejo|departamento|reuni[oó]n|atenci[oó]n de apoderados|apoyo utp|tutor tp|trabajo colaborativo|mantenci[oó]n|inventario|asamblea|tutor[ií]as/i;
async function leerHorariosPdf(buf, onProg){
  const lib = await pdfjsListo(); const OPS = lib.OPS;
  const pdf = await lib.getDocument({data: buf}).promise; const out = [];
  for (let pi=1; pi<=pdf.numPages; pi++) {
    onProg(pi, pdf.numPages);
    const p = await pdf.getPage(pi); const H = p.getViewport({scale:1}).height;
    const ol = await p.getOperatorList(); const tc = await p.getTextContent();
    const tabs = [];
    for (let i=0;i<ol.fnArray.length;i++) { const fn=ol.fnArray[i], a=ol.argsArray[i];
      if (fn===OPS.constructPath && (ol.fnArray[i+1]===OPS.fill||ol.fnArray[i+1]===OPS.eoFill) && a[2]) { const [x0,x1,y0,y1]=a[2]; if (x1-x0>30 && x1-x0<45 && x0>120) tabs.push({x0,y0,y1,d:Math.round((x0-121)/187)+1}); } }
    const items = tc.items.filter(t=>t.str.trim()).map(t=>({x:t.transform[4]/0.75, y:(H-t.transform[5])/0.75, h:Math.round(Math.abs(t.transform[3])*10)/10, s:t.str.trim()}));
    const titulo = items.filter(t=>t.y<80).sort((a,b)=>b.h-a.h)[0]?.s || `Página ${pi}`;
    const c = [];
    for (const tb of tabs) {
      if (tb.d<1 || tb.d>5) continue;
      const colR = 121+187*tb.d;
      const its = items.filter(t=>t.x>=tb.x0 && t.x<colR && t.y>tb.y0-2 && t.y<=tb.y1+2).sort((a,b)=>a.y-b.y);
      const rows = []; for (let i=0;i<ROWN.length;i++) { const ov=Math.min(ROWB[i+1],tb.y1)-Math.max(ROWB[i],tb.y0); if (ov>(ROWB[i+1]-ROWB[i])/2 && !/^R/.test(ROWN[i])) rows.push(ROWN[i]); }
      if (!rows.length) continue;
      const subj = its.filter(l=>l.h>=7).map(l=>l.s).join(" ").replace(/\s+/g," ").trim().replace(/^Raller/,"Taller");
      const cur = its.filter(l=>l.h>5 && l.h<7).map(l=>l.s).join("").replace(/\s+/g," ").trim();
      const cu = cursoPdf(cur);
      const tipo = (NO_LECT.test(subj) || cur==="No lectivo" || /UTP/.test(cur)) ? "N" : cu ? "L" : "T";
      c.push([tb.d, rows.join(","), subj, tipo==="L" ? cu : tipo==="T" ? "TALLER" : "", tipo]);
    }
    out.push({page:pi, title:titulo, c});
  }
  return out;
}
// Clasificación de horas no lectivas
const CAT_NL = [["Trabajo colaborativo PIE",/colaborativo/i],["Consejo de profesores",/consejo/i],["Reunión de departamento",/departamento|reuni[oó]n/i],["Apoyo UTP",/utp/i],["Atención de apoderados",/apoderados/i]];
const catNL = subj => (CAT_NL.find(([,re])=>re.test(subj))||["Otras no lectivas"])[0];
const CAT_CORTA = {"Trabajo colaborativo PIE":"PIE","Consejo de profesores":"Consejo","Reunión de departamento":"Depto.","Apoyo UTP":"UTP","Atención de apoderados":"Apod.","Otras no lectivas":"Otra"};
function resumenHorario(c){
  const lect={}, nl={}, ocup={}; let nL=0, nNL=0, blancos=0;
  for (const [d, rows, subj, curso, tipo] of c) {
    const bs = rows.split(",").filter(b=>b!=="AS"); if (!bs.length) continue;
    ocup[d] = ocup[d] || new Set(); bs.forEach(b=>ocup[d].add(b));
    if (tipo==="N") { const k=catNL(subj); nl[k]=(nl[k]||0)+bs.length; nNL+=bs.length; }
    else { const k=`${curso==="TALLER"?"Taller":curso} · ${subj}`; lect[k]=(lect[k]||0)+bs.length; nL+=bs.length; }
  }
  for (let d=1; d<=5; d++) for (const b of ORDEN_H) if (b!=="AL" && Number(b)<=HORAS_DIA[d] && !(ocup[d] && ocup[d].has(b))) blancos++;
  return {nL, lect, nNL, nl, blancos};
}
function gridHorario(c){
  const map={}; for (const [d,rows,subj,curso,tipo] of c) for (const b of rows.split(",")) if (b!=="AS") map[d+"|"+b]={subj,curso,tipo};
  const maxB = Math.max(9, ...c.flatMap(x=>x[1].split(",")).filter(b=>/^\d+$/.test(b)).map(Number));
  const conAl = Object.keys(map).some(k=>k.endsWith("|AL"));
  const filas = ORDEN_H.filter(b => b==="AL" ? conAl : Number(b)<=maxB);
  return `<div class="scroll"><table class="hgrid"><thead><tr><th></th>${[1,2,3,4,5].map(d=>`<th>${DIAS[d].slice(0,3)}</th>`).join("")}</tr></thead><tbody>${filas.map(b=>`<tr><th>${b==="AL"?"Alm.":b}</th>${[1,2,3,4,5].map(d=>{
    const x=map[d+"|"+b]; const fuera = b!=="AL" && Number(b)>HORAS_DIA[d];
    if (!x) return `<td class="${fuera?"gx":"gb"}" title="${fuera?"Fuera de la jornada de la planilla":"En blanco"}"></td>`;
    const txt = x.tipo==="N" ? CAT_CORTA[catNL(x.subj)] : x.tipo==="T" ? "Taller" : x.curso;
    return `<td class="${x.tipo==="N"?"gn":"gl"}" title="${esc(x.subj)}">${esc(txt)}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function lev(a,b){ const m=a.length,n=b.length; const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]); for(let j=1;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
// Títulos del PDF: "APELLIDO_P APELLIDO_M NOMBRES"
function emparejar(titulo){
  const t = norm(titulo), w = t.split(" "); let best="", bs=0;
  for (const r of ROSTER) {
    const ap=norm(r.ap), am=norm(r.am), n1=norm(r.nom).split(" ")[0]; let s=0;
    if (ap && t.startsWith(ap+" ")) { s+=3; const rest=t.slice(ap.length+1); if (am && lev(rest.slice(0,am.length), am)<=2) s+=2; }
    if (n1 && w.includes(n1)) s+=2;
    if (s>bs) { bs=s; best=r.id; }
  }
  return bs>=5 ? best : "";
}
async function cargarPdfHorarios(file){
  if (!/\.pdf$/i.test(file.name)) { toast("Sube el horario en PDF, tal como lo exporta aSc Horarios."); return; }
  S.pdf = {nombre:file.name.replace(/\.pdf$/i,""), items:[], progreso:"Preparando lector…"}; render();
  try {
    const pags = await leerHorariosPdf(await file.arrayBuffer(), (i,n)=>{ S.pdf.progreso=`Leyendo página ${i} de ${n}…`; const el=$("#horProg"); if (el) el.textContent=S.pdf.progreso; });
    const validas = pags.filter(p=>p.c.length);
    if (!validas.length) { S.pdf = null; render(); toast("No se reconocieron horarios en el PDF. Debe ser el informe por docente de aSc Horarios."); return; }
    S.pdf.items = validas.map(p => { const id=emparejar(p.title); return {title:p.title, c:p.c, id, email: id ? (docCfg(id).email||"") : "", estado:"pendiente"}; });

  } catch(e) { S.pdf = null; render(); toast(e && e.message==="script" ? "No se pudo cargar el lector de PDF. Revisa tu conexión." : "No se pudo leer el PDF. Verifica que sea el informe de aSc Horarios."); }
}

const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function monthData(ym, onlyConf){
  const [y,m] = ym.split("-").map(Number);
  const dates = [];
  for (let d=new Date(y,m-1,1); d.getMonth()===m-1; d.setDate(d.getDate()+1)) { const w=d.getDay(); if (w>0 && w<6) dates.push(iso(d)); }
  const weeks = [], wIdx = {};
  for (const f of dates) { const k=iso(monday(parseISO(f))); if (!(k in wIdx)) { wIdx[k]=weeks.length; weeks.push({from:f,to:f}); } weeks[wIdx[k]].to=f; }
  const rep={}, aus={}, mot={}; let diasCon=0, diasConf=0, horas=0, cub=0, nAus=0;
  for (const f of dates) {
    const day = S.days[f]; if (!day || !day.ausencias.length) continue;
    if (onlyConf && day.estado!=="confirmado") continue;
    diasCon++; if (day.estado==="confirmado") diasConf++;
    const wi = wIdx[iso(monday(parseISO(f)))];
    for (const a of day.ausencias) {
      nAus++;
      const bl = Object.values(a.bloques).filter(b=>b&&b.curso);
      const nc = bl.filter(b=>b.reemplazante).length;
      const x = aus[a.docente] = aus[a.docente] || {dias:new Set(), horas:0, cub:0, mot:{}};
      x.dias.add(f); x.horas += bl.length; x.cub += nc; x.mot[a.motivo] = (x.mot[a.motivo]||0)+1;
      const mm = mot[a.motivo] = mot[a.motivo] || {aus:0, horas:0, docs:new Set()};
      mm.aus++; mm.horas += bl.length; mm.docs.add(a.docente);
      horas += bl.length; cub += nc;
      for (const b of bl) if (b.reemplazante) {
        const r = rep[b.reemplazante] = rep[b.reemplazante] || {total:0, dias:new Set(), sem:weeks.map(()=>0), cursos:new Set()};
        r.total++; r.dias.add(f); r.sem[wi]++; r.cursos.add(b.curso);
      }
    }
  }
  return {dates, weeks, rep, aus, mot, diasCon, diasConf, horas, cub, nAus};
}
const nameOf = id => BY_ID[id]?.corto || id;
function monthTSV(M, which){
  if (which==="rep") {

    const rows = Object.entries(M.rep).sort((a,b)=>b[1].total-a[1].total).map(([id,r])=>[nameOf(id), ...r.sem, r.total, r.dias.size, [...r.cursos].join(", ")]);
    return [head, ...rows].map(r=>r.join("\t")).join("\n");

  const head = ["Docente","Días ausente","Horas de clase","Horas reemplazadas","Sin reemplazo","Motivos"];
  const rows = Object.entries(M.aus).sort((a,b)=>b[1].dias.size-a[1].dias.size||b[1].horas-a[1].horas).map(([id,x])=>[nameOf(id), x.dias.size, x.horas, x.cub, x.horas-x.cub, Object.entries(x.mot).map(([k,v])=>`${k} (${v})`).join("; ")]);
  return [head, ...rows].map(r=>r.join("\t")).join("\n");
}

  const repT = `<section class="card"><div class="card-h"><div class="who"><h3>Horas de reemplazo asignadas</h3><span class="muted">por docente reemplazante y semana del mes</span></div><button class="btn sm" data-act="copyRep">Copiar para Excel</button></div>
    <div class="scroll"><table class="doclist mtab"><thead><tr><th>Reemplazante</th>${M.weeks.map((w,i)=>`<th class="num">S${i+1}<br><span class="muted" style="text-transform:none;letter-spacing:0">${parseISO(w.from).getDate()}–${parseISO(w.to).getDate()}</span></th>`).join("")}<th class="num">Total</th><th class="num">Días</th><th>Cursos atendidos</th></tr></thead>
    <tbody>${repE.length?repE.map(([id,r])=>`<tr><td><b>${esc(nameOf(id))}</b></td>${r.sem.map(n=>`<td class="num${n?"":" zero"}">${n||"·"}</td>`).join("")}<td class="num"><b>${r.total}</b></td><td class="num">${r.dias.size}</td><td class="muted">${esc([...r.cursos].join(", "))}</td></tr>`).join(""):`<tr><td colspan="${M.weeks.length+4}" class="muted">Aún no hay reemplazantes asignados este mes.</td></tr>`}</tbody>
    ${repE.length?`<tfoot><tr><td>Total</td>${semTot.map(n=>`<td class="num">${n}</td>`).join("")}<td class="num">${M.cub}</td><td></td><td></td></tr></tfoot>`:""}</table></div></section>`;

  const ausE = Object.entries(M.aus).sort((a,b)=>b[1].dias.size-a[1].dias.size||b[1].horas-a[1].horas);
  const ausT = `<section class="card"><div class="card-h"><div class="who"><h3>Docentes reemplazados</h3><span class="muted">días y horas de ausencia, con sus motivos</span></div><button class="btn sm" data-act="copyAus">Copiar para Excel</button></div>
    <div class="scroll"><table class="doclist mtab"><thead><tr><th>Docente ausente</th><th class="num">Días</th><th class="num">Horas de clase</th><th class="num">Reemplazadas</th><th class="num">Sin reemplazo</th><th>Motivos</th></tr></thead>
    <tbody>${ausE.map(([id,x])=>`<tr><td><b>${esc(nameOf(id))}</b>${JEFE_ID[id]?`<br><span class="muted" style="font-size:.82rem">Jefe ${esc(JEFE_ID[id])}</span>`:""}</td><td class="num">${x.dias.size}</td><td class="num">${x.horas}</td><td class="num">${x.cub}</td><td class="num">${x.horas-x.cub?`<span class="pill warn">${x.horas-x.cub}</span>`:"0"}</td>
      <td><span class="chips">${Object.entries(x.mot).map(([k,v])=>`<span class="pill">${esc(k)}${v>1?` ×${v}`:""}</span>`).join("")}</span></td></tr>`).join("")}</tbody>
    <tfoot><tr><td>Total</td><td class="num">${M.nAus}</td><td class="num">${M.horas}</td><td class="num">${M.cub}</td><td class="num">${M.horas-M.cub}</td><td></td></tr></tfoot></table></div></section>`;

  return head + kpi + motivos + repT + ausT;
}

/* ---------- Usuarios ---------- */
function viewUsuarios(){
  const list = Object.entries(S.users).sort((a,b)=>a[1].nombre.localeCompare(b[1].nombre,"es"));
  const rows = list.map(([u,x]) => `<tr data-u="${esc(u)}" class="${x.inactivo?"off":""}">
    <td><b>${esc(x.nombre)}</b><br><span class="muted mono" style="font-size:.82rem">${esc(u)}</span></td>
    <td><select data-uf="rol" aria-label="Rol de ${esc(u)}" ${u===S.me.usuario?"disabled":""}>${Object.entries(ROLES).map(([k,v])=>`<option value="${k}"${k===x.rol?" selected":""}>${v}</option>`).join("")}</select></td>
    <td><label class="chk"><input type="checkbox" data-uf="activo" ${x.inactivo?"":"checked"} ${u===S.me.usuario?"disabled":""}> Activo</label></td>
    <td><span class="ask"><input class="inp" style="max-width:190px" type="password" data-uf="pw" placeholder="Nueva contraseña" autocomplete="new-password" aria-label="Nueva contraseña de ${esc(u)}"><button class="btn sm" data-act="resetPw">Restablecer</button></span></td>
    <td class="muted" style="font-size:.82rem">${x.creado?fmtWhen(x.creado):""}${x.creadoPor?` · ${esc(x.creadoPor)}`:""}</td></tr>`).join("");
  return `<div class="toolbar"><div><div class="eyebrow">Acceso</div><h2>Usuarios</h2></div></div>
    <p class="muted" style="margin:0;max-width:80ch"><b>Director/a, Jefe/a de UTP y Administrador</b>: asignan reemplazos, cargan horarios, revisan el historial y administran usuarios. <b>Equipo UTP</b>: registra ausencias, asigna y confirma. <b>Solo consulta</b>: ve la información sin modificarla. Cada cambio queda registrado con el nombre de quien lo hizo.</p>
    <form class="card uform" id="fNewUser" autocomplete="off">
      <label class="ufield">Usuario<input class="inp" id="nuU" required></label>
      <label class="ufield">Nombre<input class="inp" id="nuN" required></label>
      <label class="ufield">Rol<select id="nuR">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}"${k==="asignador"?" selected":""}>${v}</option>`).join("")}</select></label>
      <label class="ufield">Contraseña inicial<input class="inp" id="nuP" type="password" minlength="8" required autocomplete="new-password"></label>
      <button class="btn primary" type="submit">Crear usuario</button></form>
    <div class="card scroll"><table class="doclist" style="min-width:760px"><thead><tr><th>Usuario</th><th>Rol</th><th>Estado</th><th>Contraseña</th><th>Creado</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
$("#view").addEventListener("submit", async e => {
  if (e.target.id!=="fNewUser") return; e.preventDefault();
  const u = normUser($("#nuU").value), nom = $("#nuN").value.trim(), p = $("#nuP").value;
  if (!u || !nom) { toast("Completa usuario y nombre."); return; }
  if (S.users[u]) { toast(`El usuario ${u} ya existe.`); return; }
  if (p.length < 8) { toast("La contraseña debe tener al menos 8 caracteres."); return; }
  S.users[u] = {nombre:nom, rol:$("#nuR").value, ...(await hashPass(p)), creado:new Date().toISOString(), creadoPor:S.me.usuario};
  saveUsers(); render(); toast(`Usuario ${u} creado`);
});

/* ---------- Adjuntos ---------- */
async function uploadAdj(f, a, h, file){
  const blk = a.bloques[h]; if (!blk || !S.assets) return;
  const ext = (file.name.split(".").pop()||"").toLowerCase();
  const type = TEXT_TYPES[ext] || BIN_TYPES[ext];
  if (!type) { toast("Formato no admitido. Usa PDF, imagen, video o texto; exporta Word, Excel o PowerPoint a PDF."); return; }
  const used = (blk.adjuntos||[]).reduce((s,x)=>s+(x.size||0),0);
  if (used + file.size > MAX_ADJ) { toast(`El archivo pesa ${fmtMB(file.size)}: con lo ya adjunto se superan los 18 MB del bloque.`); return; }
  const key = a.id+"|"+h; S.uploading[key] = file.name; render();
  try {
    const res = await S.assets.upload(file, {type});
    const cur = findAus(a.id)?.bloques[h] || blk;
    cur.adjuntos = [...(cur.adjuntos||[]), {id: res.id, name: file.name, size: res.sizeBytes || file.size, type: res.contentType || type, por: quien()}];
    hist(S.days[f] || ensureDay(), `${nameOf(a.docente)} · ${hLabel(h)}: adjuntó ${file.name}`, {aus:a.docente, rep:cur.reemplazante});
    saveDay(f); toast("Archivo adjuntado");
  } catch(e) {
    const m = {too_large:"El archivo supera el máximo permitido.", unsupported_type:"Formato no admitido. Exporta el documento a PDF y vuelve a intentarlo.", quota_or_state:"No queda espacio para adjuntos en esta página.", rate_limited:"Demasiados intentos seguidos; espera un momento."}[e && e.code];
    toast(m || "No se pudo subir el archivo. Inténtalo de nuevo.");
  } finally { delete S.uploading[key]; render(); }
}

/* ---------- Eventos ---------- */
function ensureDay(){ if (!S.days[S.date]) S.days[S.date] = emptyDay(S.date); return S.days[S.date]; }
function findAus(id){ return ensureDay().ausencias.find(a=>a.id===id); }
function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true, 2600); }
function showBanner(t){ const b=$("#banner"); b.textContent=t; b.hidden=false; }
function go(tab){ if (tab==="mensual" && S.tab!=="mensual") S.month=S.date.slice(0,7); S.tab=tab; S.confirmAsk=false; try{sessionStorage.setItem("utp-tab",tab);}catch(e){} render(); window.scrollTo({top:0}); }
async function copy(text){ try { await navigator.clipboard.writeText(text); toast("Mensaje copiado"); } catch(e){ toast("No se pudo copiar automáticamente: selecciona el texto y cópialo."); } }

$("#days").addEventListener("click", e => { const b=e.target.closest(".day"); if(!b) return; S.date=b.dataset.date; S.confirmAsk=false; S.removeAsk=null; render(); });
$("#prevW").onclick = () => { const d=parseISO(S.date); d.setDate(d.getDate()-7); S.date=iso(d); render(); };
$("#nextW").onclick = () => { const d=parseISO(S.date); d.setDate(d.getDate()+7); S.date=iso(d); render(); };
$("#todayB").onclick = () => { let d=new Date(); const w=d.getDay(); if(w===6) d.setDate(d.getDate()+2); if(w===0) d.setDate(d.getDate()+1); S.date=iso(d); render(); };
$("#datePick").onchange = e => { if (!e.target.value) return; let d=parseISO(e.target.value); const w=d.getDay(); if(w===6) d.setDate(d.getDate()+2); if(w===0) d.setDate(d.getDate()+1); S.date=iso(d); render(); };
document.querySelector(".tabs").addEventListener("click", e => { const t=e.target.closest(".tab"); if(t) go(t.dataset.tab); });

const view = $("#view");
view.addEventListener("click", e => {
  const g = e.target.closest("[data-tab-go]"); if (g) { if (g.dataset.filter) S.docFilter=g.dataset.filter; go(g.dataset.tabGo); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act; const f = S.date;
  if (act==="addAbs") {
    const id=$("#newAbs").value; if (!id) { toast("Selecciona al docente ausente."); return; }
    const bloques = {};
    for (const c of horarioDia(id, weekday(f)) || []) if (c.tipo!=="N") bloques[c.h] = { curso: c.curso, asignatura: asignaturaDe(c.subj), origen: "horario" };
    const a = { id: uid(), docente: id, motivo: $("#newMot").value, bloques, creado: quien() };
    aplicarMotivo(a);
    const d = ensureDay(); d.ausencias.push(a);
    hist(d, `Registró la ausencia de ${BY_ID[id].corto} (${a.motivo})`, {aus:id});
    const n = Object.keys(bloques).length;
    saveDay(f); render(); toast(horarioDe(id) ? `Ausencia de ${BY_ID[id].corto} registrada · ${n} ${n===1?"bloque precargado":"bloques precargados"}${pendientes(a)?" · confirma la presencia por bloque":""}` : `Ausencia de ${BY_ID[id].corto} registrada · sin horario cargado`);
  }
  else if (act==="removeAsk") { S.removeAsk=b.dataset.aid; render(); }
  else if (act==="removeNo") { S.removeAsk=null; render(); }
  else if (act==="removeYes") { const d=ensureDay(); const a=d.ausencias.find(x=>x.id===b.dataset.aid); d.ausencias=d.ausencias.filter(x=>x.id!==b.dataset.aid); if (a) hist(d, `Quitó la ausencia de ${nameOf(a.docente)}`, {aus:a.docente, rep:Object.values(a.bloques).map(x=>x&&x.reemplazante)}); S.removeAsk=null; saveDay(f); render(); }
  else if (act==="confirmAsk") { S.confirmAsk=true; render(); }
  else if (act==="confirmNo") { S.confirmAsk=false; render(); }
  else if (act==="confirmYes") { const d=ensureDay(); d.estado="confirmado"; d.confirmado=new Date().toISOString(); d.confirmadoPor=quien(); hist(d, "Confirmó la asignación del día"); S.confirmAsk=false; saveDay(f); toast("Asignación confirmada. Avisos listos para enviar."); go("notificaciones"); }
  else if (act==="reopen") { const d=ensureDay(); d.estado="borrador"; hist(d, "Reabrió el día para editar"); saveDay(f); render(); toast("Día reabierto. Recuerda volver a confirmar."); }
  else if (act==="pres") {
    const tr=b.closest("tr"); const a=findAus(tr.dataset.aid); const h=tr.dataset.h; const blk=a?.bloques[h]; if (!blk) return;
    if (b.dataset.v==="liceo") enLiceo(blk); else ausenteEn(blk);
    delete blk.pend; if (blk.asignadoPor) blk.modificadoPor = quien();
    hist(ensureDay(), `${nameOf(a.docente)} · ${hLabel(h)}: ${b.dataset.v==="liceo"?"en el liceo":"ausente"}`, {aus:a.docente});
    saveDay(f); render();
  }
  else if (act==="resetPw") {
    const tr=b.closest("tr"); const u=tr.dataset.u; const p=tr.querySelector("[data-uf=pw]").value;
    if (p.length < 8) { toast("La nueva contraseña debe tener al menos 8 caracteres."); return; }
    hashPass(p).then(hp => { S.users[u] = {...S.users[u], ...hp, cambioClave:new Date().toISOString(), cambioPor:S.me.usuario}; if (u===S.me.usuario) { S.me.h=hp.hash; try{sessionStorage.setItem("utp-sesion", JSON.stringify({u, h:hp.hash}));}catch(_){} } saveUsers(); render(); toast(`Contraseña de ${u} restablecida`); });
  }
  else if (act==="horConf") {
    const it = S.pdf?.items[Number(b.closest("[data-hi]").dataset.hi)]; if (!it) return;
    if (confirmarHorario(it)) { saveCfg(); saveHor(); render(); toast(`Horario de ${nameOf(it.id)} confirmado`); }
  }
  else if (act==="horConfAll") {
    const used = {}; S.pdf.items.forEach(it=>{ if (it.id) used[it.id]=(used[it.id]||0)+1; });
    let n = 0; for (const it of S.pdf.items) if (it.estado!=="confirmado" && it.id && used[it.id]===1 && confirmarHorario(it)) n++;
    if (n) { saveCfg(); saveHor(); } render(); toast(`${n} horarios confirmados`);
  }
  else if (act==="horDescartar") { S.pdf = null; render(); }
  else if (act==="hfClear") { S.hf = {dia:"", u:"", aus:"", rep:""}; render(); }
  else if (act==="copyHist") {
    const rows = histFiltrar(histEntries()).map(x=>[fmtWhen(x.en), x.fecha, x.n, x.u, x.aus?nameOf(x.aus):"", (x.rep||[]).map(nameOf).join(", "), x.txt].join("\t"));
    copy(["Fecha y hora\tDía\tUsuario\tCuenta\tDocente a reemplazar\tReemplazante\tCambio", ...rows].join("\n"));
  }
  else if (act==="okProp") {
    const a=findAus(b.dataset.aid); if (!a) return;
    for (const k in a.bloques) if (a.bloques[k]) delete a.bloques[k].pend;
    hist(ensureDay(), `Confirmó la propuesta de ${a.motivo} para ${nameOf(a.docente)}`, {aus:a.docente}); saveDay(f); render();
  }
  else if (act==="copy") { const d=getDay(f); copy(message(d, b.dataset.id, buildNotifs(d)[b.dataset.id])); }
  else if (act==="copyAll") {
    const d=getDay(f); const per=buildNotifs(d);
    const lines = d.ausencias.flatMap(a => Object.entries(a.bloques).filter(([,x])=>x&&x.curso).sort((x,y)=>hOrd(x[0])-hOrd(y[0])).map(([h,x])=>`${hLabel(h)} ·${x.curso} · ${BY_ID[a.docente]?.corto} → ${x.reemplazante?BY_ID[x.reemplazante]?.corto:"SIN REEMPLAZO"}${x.actividad?` (${x.actividad})`:""}`));
    copy(`REEMPLAZOS ${fmtLong(d.fecha).toUpperCase()}\n\n${lines.join("\n")}\n\nReemplazantes: ${Object.keys(per).map(id=>BY_ID[id]?.corto).join(", ")}`);
  }
  else if (act==="rmAdj") {
    const tr=b.closest("tr"); const a=findAus(tr.dataset.aid); const blk=a?.bloques[tr.dataset.h]; if (!blk?.adjuntos) return;
    const [x] = blk.adjuntos.splice(Number(b.dataset.i),1); if (x) hist(ensureDay(), `${nameOf(a.docente)} · ${hLabel(tr.dataset.h)}: quitó el adjunto ${x.name}`, {aus:a.docente, rep:blk.reemplazante}); saveDay(f); render();
    if (x && S.assets) S.assets.delete(x.id).catch(()=>{});
  }
  else if (act==="prevM" || act==="nextM") { const [y,m]=S.month.split("-").map(Number); const d=new Date(y, m-1+(act==="nextM"?1:-1), 1); S.month=`${d.getFullYear()}-${pad(d.getMonth()+1)}`; render(); }
  else if (act==="copyRep" || act==="copyAus") { copy(monthTSV(monthData(S.month,S.onlyConf), act==="copyRep"?"rep":"aus")); }
  else if (act==="sent") { const d=ensureDay(); d.notif=d.notif||{}; { const items=buildNotifs(d)[b.dataset.id]; d.notif[b.dataset.id]={estado:"enviado", en:new Date().toISOString(), msg: message(d,b.dataset.id,items), sig: firma(items), por: quien()}; hist(d, `Marcó como notificado a ${nameOf(b.dataset.id)}`, {rep:b.dataset.id}); } saveDay(f); render(); }
  else if (act==="unsent") { const d=ensureDay(); if (d.notif) delete d.notif[b.dataset.id]; hist(d, `Desmarcó el aviso de ${nameOf(b.dataset.id)}`, {rep:b.dataset.id}); saveDay(f); render(); }
});
view.addEventListener("change", e => {
  const el = e.target; const f = S.date;
  if (el.id==="onlyConf") { S.onlyConf = el.checked; render(); return; }
  if (el.id==="horFile") { const file = el.files && el.files[0]; el.value = ""; if (file) cargarPdfHorarios(file); return; }
  if (el.dataset.hf) { const it = S.pdf?.items[Number(el.closest("[data-hi]").dataset.hi)]; if (!it) return;
    if (el.dataset.hf==="id") { it.id = el.value; if (el.value && !it.email) it.email = docCfg(el.value).email || ""; render(); } else it.email = el.value; return; }
  const hfMap = {hfDia:"dia", hfU:"u", hfAus:"aus", hfRep:"rep"};
  if (hfMap[el.id]) { S.hf[hfMap[el.id]] = el.value; render(); return; }
  if (el.dataset.uf==="rol" || el.dataset.uf==="activo") {
    const u = el.closest("tr").dataset.u; const x = S.users[u] = {...S.users[u]};
    if (el.dataset.uf==="rol") x.rol = el.value; else if (el.checked) delete x.inactivo; else x.inactivo = true;
    saveUsers(); render(); return;
  }
  if (el.dataset.uf) return;
  if (el.dataset.cf) {
    const id = el.closest("tr").dataset.id; S.cfg.docentes = S.cfg.docentes || {}; const c = S.cfg.docentes[id] = {...(S.cfg.docentes[id]||{})};
    if (el.dataset.cf==="activo") { if (el.checked) delete c.inactivo; else c.inactivo = true; el.closest("tr").classList.toggle("off", !el.checked); }
    else c[el.dataset.cf] = el.value.trim();
    saveCfg(); return;
  }
  const fld = el.dataset.f; if (!fld) return;
  const aid = el.dataset.aid || el.closest("tr")?.dataset.aid; const a = findAus(aid); if (!a) return;
  if (fld==="file") { const file = el.files && el.files[0]; el.value = ""; if (file) uploadAdj(f, a, el.closest("tr").dataset.h, file); return; }
  const d = ensureDay(); const quienAus = nameOf(a.docente);
  if (fld==="motivo") { const prev=a.motivo; a.motivo = el.value; aplicarMotivo(a); hist(d, `${quienAus}: cambió el motivo de ${prev} a ${a.motivo}`, {aus:a.docente}); saveDay(f); render(); return; }  const h = el.closest("tr").dataset.h; const prev = a.bloques[h] || {}; const b = a.bloques[h] = {...prev};
  const etiquetas = {curso:"curso", asignatura:"asignatura", reemplazante:"reemplazante", actividad:"actividad", ausentes:"estudiantes ausentes"};
  const val = v => fld==="reemplazante" ? (v?nameOf(v):"sin asignar") : (v===""||v==null ? "vacío" : v);
  if (fld==="curso" && !el.value) delete a.bloques[h];
  else if (fld==="curso" && el.value===LICEO) { enLiceo(b); delete b.pend; }
  else {
    b[fld] = fld==="ausentes" ? (el.value===""?"":Number(el.value)) : el.value;
    if (fld==="curso") { delete b.pend; delete b.cursoOrig; delete b.asigOrig; }
  }
  if (a.bloques[h]) {
    if (fld==="reemplazante" && el.value && !b.asignadoPor) b.asignadoPor = quien();
    else if (b.asignadoPor) b.modificadoPor = quien();
  }
  hist(d, `${quienAus} · ${hLabel(h)}: ${etiquetas[fld]} ${fld==="actividad" ? "actualizada" : `${val(prev[fld])} → ${val(fld==="curso" && !el.value ? "" : (a.bloques[h]||{})[fld])}`}`, {aus:a.docente, rep:[prev.reemplazante, (a.bloques[h]||{}).reemplazante]});
  saveDay(f);
  if (fld==="curso"||fld==="reemplazante") render(); else renderWeek();
});
view.addEventListener("input", e => {
  if (e.target.id==="docFilter") { S.docFilter=e.target.value; const pos=e.target.selectionStart; render(); const n=$("#docFilter"); n.focus(); n.setSelectionRange(pos,pos); }
});

boot();
</script>
